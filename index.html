<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сантехника и мебель для ванной комнаты</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=PT+Sans:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles/base/base.css">
    <link rel="stylesheet" href="./styles/base/fonts.css">
    <link rel="stylesheet" href="./styles/home/header.css">
    <link rel="stylesheet" href="./styles/home/offer.css">
</head>
<body>
    <header>
        <div class="background-header-offer">
            <section class="header">
                <div class="header__left">
                    <img class="header__logo" src="./src/icon/Logo.svg" alt="Логотип">
                    <span class="header__text">Сантехника для всех</span>
                </div>
                <div class="header__right">
                    <a class="header__tel" href="tel:+79055432345">+7 (905) 543 23 45</a>
                    <button class="header__search">
                        <img src="./src/icon/Search.svg" alt="Лупа">
                    </button>
                </div>
            </section>

            <section class="offer">
                <div class="offer__right">
                    <h1 class="offer__title">Сантехника и мебель для ванной комнаты</h1>
                    <nav class="offer__navigation">
                        <a class="offer__link" href="#">О компании</a>
                        <a class="offer__link offer__line" href="#">О продукции</a>
                        <a class="offer__link offer__line" href="#">Каталог товаров</a>
                    </nav>
                    <div class="offer__indicators">
                        <div class="offer__indicator"></div>
                        <div class="offer__indicator"></div>
                        <div class="offer__indicator"></div>
                    </div>
                </div>
                <div class="offer__left">
                    <img class="offer__image" src="./src/images/Mixer.png" alt="Смеситель">
                    <div class="offer__price">от 4 990 ₽</div>
                </div>
            </section>
        </div>
    </header>
</body>
</html>
